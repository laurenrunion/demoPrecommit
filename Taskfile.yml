version: "3"

tasks:
  deps:
    desc: Install dev dependencies
    run: once
    cmds:
      - command -v pre-commit >/dev/null 2>&1 || python3 -m pip install pre-commit

  unit:
    desc: Run local unit tests
    deps: [deps]
    cmds:
      - python3 tests/test_unit.py

  whitespace:
    desc: Run the external pre-commit hook (trailing-whitespace) via pre-commit
    deps: [deps]
    cmds:
      - pre-commit run trailing-whitespace --all-files

  slow:
    desc: Run long-running tests (CI only, not run locally)
    cmds:
      - echo "Running long tests"

  fast:
    desc: Run both local checks (unit tests + external pre-commit hook)
    deps: [unit, whitespace]
