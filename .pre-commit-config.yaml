default_stages: [pre-commit]

repos:
  # External hook: strip trailing whitespace
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]

  # Local hooks
  - repo: local
    hooks:
      - id: unit-tests
        name: Run add() unit tests
        entry: python3 tests/test_unit.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: jira-ticket-check
        name: Check commit message for Jira ticket
        entry: python3 tests/check_jira.py
        language: system
        stages: [commit-msg]
